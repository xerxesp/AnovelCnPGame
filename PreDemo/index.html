function showMenu(){clearTimeout(endingTimer);$('#ending').classList.remove('open');$('#menu').classList.add('open');st.started=false}
function reset(){Object.assign(st,{started:true,chapter:0,scene:0,day:1,minutes:420,coins:8,faction:'doubt',fatigue:18,hunger:24,thirst:18,mood:64,items:[],clues:new Set(),truths:new Set(),ends:new Set(),endingMeta:{},questions:new Set(),completedChapters:new Set(),endingReady:false,visited:new Set(),done:new Set(),dialogueIndex:0,route:[],investments:{bar:0,shop:0},economyTier:0});activePanelFrame=frame;pendingTruth2Advance=false;clearTimeout(chapterTimer);pendingSceneMove=null;dialogueLocked=true;dialogueMode='intro';$('#chapter-transition').classList.remove('open');panelReady=false;shopPanelReady=false;pendingPanelMessages.length=0;pendingShopMessages.length=0;frame.src='truth-panel2.html';shopFrame.src='truth-panel2.html?view=shop';$('#menu').classList.remove('open');renderScene();loadIntro()}
window.addEventListener('message',e=>{if(!e.data)return;if(e.data.type==='truth-ending-crafted')onEnding(e.data);if(e.data.type==='truth-question-crafted'){for(const id of e.data.consumedCardIds||[]){const cm=/^CLUE_(\d+)$/.exec(id);if(cm){st.clues.delete(+cm[1]);sendShop({type:'story-remove-card',cardId:id})}}const m=/^KQ_(\d+)$/.exec(e.data.cardId||'');if(m){st.questions.add(+m[1]);sendShop({type:'story-grant-card',cardId:e.data.cardId})}renderTasks();notice(`关键问题已合成：${e.data.name}`)}if(e.data.type==='truth-economy-tier'){st.economyTier=Number(e.data.tier)||0;sendShop({type:'truth-economy-tier',tier:st.economyTier})}if(e.data.type==='truth-gold-changed'){st.coins=Math.max(0,Number(e.data.gold)||0);send({type:'story-set-gold',gold:st.coins});sendShop({type:'story-set-gold',gold:st.coins});for(const id of [e.data.cardId,e.data.freeCardId]){const m=/^CLUE_(\d+)$/.exec(id||'');if(!m)continue;if(e.data.action==='sell-clue'){st.clues.delete(+m[1]);send({type:'story-remove-card',cardId:id});sendShop({type:'story-remove-card',cardId:id})}else{st.clues.add(+m[1]);grantToBoth(id)}}renderTasks();notice(e.data.action==='buy-clue'?'线索已放入画布卡库':e.data.action==='sell-clue'?'线索已售出':'金币已更新')}});
$('#start').onclick=reset;$('#exit').onclick=()=>notice('可以关闭浏览器窗口结束游戏。');$('#end-game').onclick=showMenu;$('#close').onclick=closeWindow;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#ending').classList.contains('open'))showMenu();else if($('#panel-overlay').classList.contains('open'))closeWindow()}});
$('#line').onclick=continueDialogue;$('#actions').innerHTML='<button id="continue">继续 / 下一句</button>';$('#continue').onclick=continueDialogue;
$('#menu').classList.add('open');renderScene();
})();
</script></body></html>
